[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "perturb-interp"
version = "0.1.0"
description = "Gaussian perturbation interpretability for black-box regression"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib", "h5py"]

[project.optional-dependencies]
# the example network and notebooks
examples = ["torch", "jupyter", "tqdm", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["src"]
